<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LocalHarness</title>
    <!--
      Nothing in this window loads from the network: every HTTP call is made by
      the main process and arrives over IPC. Images and audio reach the renderer
      as data: URLs (see artifacts:readDataUrl), so file: is not needed either.
      'unsafe-inline' is granted to styles only, for React's style attributes.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               media-src 'self' data:;
               font-src 'self' data:;
               connect-src 'self';
               object-src 'none';
               frame-src 'none';
               base-uri 'none';
               form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
